<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Settings - ScriptForExe.net</title>
    <style>
        :root { --bg: #0b0f19; --card-bg: #131d31; --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8; --border: #1e293b; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 25px; color: var(--accent); text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        
        .profile-card { background: var(--card-bg); border-radius: 16px; padding: 30px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 25px; margin-bottom: 35px; flex-wrap: wrap; }
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; background: #000; }
        .profile-details { flex-grow: 1; }
        .profile-details h1 { margin: 0 0 6px 0; font-size: 26px; font-weight: 800; color: var(--text); }
        .profile-stats { display: flex; gap: 20px; margin-top: 12px; font-size: 14px; color: var(--muted); }
        .profile-stats strong { color: var(--accent); }

        .bio-section { margin-top: 15px; display: flex; gap: 10px; }
        .bio-input { flex-grow: 1; background: #090d16; border: 1px solid var(--border); color: white; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
        .bio-input:focus { border-color: var(--accent); }

        .section-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        
        .script-manage-card { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 16px 20px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border); transition: 0.2s; }
        .script-manage-card:hover { border-color: #334155; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
        .delete-btn:hover { background: #dc2626; }
        
        .btn { background: var(--accent); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; text-decoration: none; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; }
        .btn:hover { background: #0ea5e9; }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="back-link">← Back to Index</a>
        
        <!-- Profile Banner / Header -->
        <div class="profile-card" id="profile-card">
            <img id="user-avatar" class="profile-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
            <div class="profile-details">
                <h1 id="user-name">Loading Profile...</h1>
                <div class="profile-stats">
                    <span>Points: <strong id="user-points">0</strong></span>
                    <span>Role: <strong id="user-role">Member</strong></span>
                </div>
                <div class="bio-section">
                    <input type="text" id="bio-input" class="bio-input" placeholder="Update your public scripter bio...">
                    <button onclick="saveBio()" class="btn">Save Bio</button>
                </div>
            </div>
        </div>

        <h2 class="section-title">Manage Your Published Scripts</h2>
        <div id="user-posts-container">
            <p style="color: var(--muted);">Loading your posts...</p>
        </div>
    </div>

    <script>
        async function loadUserSettings() {
            try {
                const meRes = await fetch('/api/me');
                const meData = await meRes.json();
                
                if (!meData.authenticated) {
                    window.location.href = '/';
                    return;
                }

                // Populate profile details
                document.getElementById('user-avatar').src = meData.user.avatar;
                document.getElementById('user-name').textContent = meData.user.username;
                document.getElementById('user-points').textContent = meData.user.points || 0;
                document.getElementById('user-role').textContent = meData.user.isAdmin ? 'Administrator' : 'Scripter';
                document.getElementById('bio-input').value = meData.user.bio || '';

                // Fetch user's scripts
                const userRes = await fetch(`/api/users/${meData.user.id}`);
                const userData = await userRes.json();

                const container = document.getElementById('user-posts-container');
                container.innerHTML = '';
                
                if (!userData.scripts || userData.scripts.length === 0) {
                    container.innerHTML = '<p style="color: var(--muted);">You haven\'t published any scripts yet.</p>';
                    return;
                }

                userData.scripts.forEach(script => {
                    const card = document.createElement('div');
                    card.className = 'script-manage-card';
                    card.innerHTML = `
                        <div>
                            <h4 style="margin: 0 0 4px 0; color: var(--text); font-size: 16px;">${script.title}</h4>
                            <small style="color: var(--muted);">Category: ${script.category} | Views: ${script.views || 0}</small>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <a href="/page.html?id=${script.id}" class="btn" style="padding: 8px 14px; font-size: 13px; background: #1e293b; color: white; border: 1px solid #334155;">View</a>
                            <button onclick="deleteScript('${script.id}')" class="delete-btn">Delete</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Error loading settings profile:', err);
                document.getElementById('user-posts-container').innerHTML = '<p style="color: #ef4444;">Failed to load user profile data.</p>';
            }
        }

        async function saveBio() {
            const bio = document.getElementById('bio-input').value;
            try {
                const res = await fetch('/api/users/bio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bio })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Bio updated successfully!');
                } else {
                    alert('Failed to update bio.');
                }
            } catch {
                alert('Error connecting to server.');
            }
        }

        async function deleteScript(scriptId) {
            if (!confirm('Are you sure you want to permanently delete this script?')) return;

            try {
                const res = await fetch(`/api/scripts/${scriptId}`, { method: 'DELETE' });
                const data = await res.json();

                if (data.success) {
                    alert('Script deleted successfully.');
                    loadUserSettings(); // Refresh list
                } else {
                    alert('Failed to delete: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                console.error('Delete error:', err);
                alert('An error occurred while deleting the script.');
            }
        }

        document.addEventListener('DOMContentLoaded', loadUserSettings);
    </script>
</body>
</html>
