<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Settings - ScriptsForExe.gg</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 40px auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1, h2 { color: #38bdf8; }
        .profile-box { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
        .profile-box img { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #38bdf8; }
        .script-manage-card { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 15px 20px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #334155; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .delete-btn:hover { background: #dc2626; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #38bdf8; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="back-link">← Back to Home</a>
        <h1>Account Settings</h1>
        
        <div class="profile-box" id="profile-section">
            <img id="user-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
            <div>
                <h2 id="user-name" style="margin: 0 0 5px 0;">Loading...</h2>
                <p id="user-bio" style="margin: 0; color: #94a3b8;"></p>
            </div>
        </div>

        <h2>Manage Your Scripts</h2>
        <div id="user-posts-container">
            <p style="color: #94a3b8;">Loading your posts...</p>
        </div>
    </div>

    <script>
        async function loadUserSettings() {
            try {
                const meRes = await fetch('/api/me');
                const meData = await meRes.json();
                
                if (!meData.authenticated) {
                    window.location.href = '/';
                    return;
                }

                // Populate user profile info
                document.getElementById('user-avatar').src = meData.user.avatar;
                document.getElementById('user-name').textContent = meData.user.username;
                document.getElementById('user-bio').textContent = meData.user.bio || 'No bio provided.';

                // Fetch user's scripts
                const userRes = await fetch(`/api/users/${meData.user.id}`);
                const userData = await userRes.json();

                const container = document.getElementById('user-posts-container');
                container.innerHTML = '';
                
                if (!userData.scripts || userData.scripts.length === 0) {
                    container.innerHTML = '<p style="color: #94a3b8;">You haven\'t posted any scripts yet.</p>';
                    return;
                }

                userData.scripts.forEach(script => {
                    const card = document.createElement('div');
                    card.className = 'script-manage-card';
                    card.innerHTML = `
                        <div>
                            <h4 style="margin: 0 0 4px 0; color: #f8fafc;">${script.title}</h4>
                            <small style="color: #94a3b8;">Category: ${script.category}</small>
                        </div>
                        <button onclick="deleteScript('${script.id}')" class="delete-btn">Delete</button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error('Error loading user settings:', err);
                document.getElementById('user-posts-container').innerHTML = '<p style="color: #ef4444;">Failed to load posts.</p>';
            }
        }

        async function deleteScript(scriptId) {
            if (!confirm('Are you sure you want to delete this script?')) return;

            try {
                const res = await fetch(`/api/scripts/${scriptId}`, {
                    method: 'DELETE'
                });
                const data = await res.json();

                if (data.success) {
                    alert('Post deleted successfully!');
                    loadUserSettings(); // Refresh list
                } else {
                    alert('Failed to delete: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                console.error('Delete error:', err);
                alert('An error occurred while deleting the post.');
            }
        }

        document.addEventListener('DOMContentLoaded', loadUserSettings);
    </script>
</body>
</html>
