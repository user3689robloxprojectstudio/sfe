<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | ScriptsForExe.gg</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0b0f19; --surface: rgba(30, 41, 59, 0.65); --primary: #38bdf8; --danger: #ef4444; --text-main: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 500px; border-radius: 24px; padding: 35px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.7); color: var(--text-main); outline: none; }
        .btn { padding: 10px 20px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
        .btn-primary { background: var(--primary); color: #0b0f19; }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); width: 100%; padding: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h1 style="font-size:1.6rem; font-weight:800; color:var(--primary);">⚙️ Settings</h1>
            <a href="/" style="color:var(--primary); text-decoration:none; font-weight:700;">← Home</a>
        </div>
        <form id="bioForm" class="form-group">
            <label>Developer Bio</label>
            <textarea id="bioInput" rows="3"></textarea>
            <button type="submit" class="btn btn-primary" style="margin-top:10px;">Save Bio</button>
        </form>
        <button onclick="window.location.href='/logout'" class="btn btn-danger" style="margin-top:20px;">Log Out</button>
    </div>
    <script>
        async function init() {
            const me = await fetch('/api/me').then(r => r.json());
            if (!me.authenticated) { window.location.href = '/auth/discord'; return; }
            document.getElementById('bioInput').value = me.user.bio || '';
        }
        document.getElementById('bioForm').onsubmit = async (e) => {
            e.preventDefault();
            const bio = document.getElementById('bioInput').value;
            await fetch('/api/users/bio', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({bio}) });
            alert('Bio saved!');
        };
        init();
    </script>
</body>
</html>
