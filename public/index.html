<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptsForExe.gg | Largest Roblox Script Index</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --sidebar-bg: #07090e;
            --surface: #121826;
            --primary: #38bdf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }

        /* Sidebar Navigation */
        aside { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; position: fixed; height: 100vh; padding: 25px 20px; z-index: 1000; }
        .logo { font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none; margin-bottom: 30px; display: block; }
        .logo img { height: 32px; width: auto; display: block; }
        .sidebar-menu { display: flex; flex-direction: column; gap: 8px; list-style: none; }
        .sidebar-menu a { color: var(--text-muted); text-decoration: none; padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 12px; transition: 0.2s; cursor: pointer; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background: rgba(56, 189, 248, 0.1); color: var(--primary); }
        
        .sidebar-account { border-top: 1px solid var(--border); padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .sidebar-btn { background: var(--primary); color: #0b0f19; text-align: center; padding: 10px; border-radius: 12px; font-weight: 800; text-decoration: none; display: block; }

        /* Main Content Area */
        main { margin-left: 260px; flex: 1; display: flex; flex-direction: column; padding: 25px 40px; }
        
        /* Top Navigation Header */
        .top-header { display: flex; justify-content: flex-end; align-items: center; gap: 15px; margin-bottom: 30px; }
        .search-box { flex: 1; max-width: 500px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 16px; display: flex; align-items: center; }
        .search-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 0.95rem; outline: none; }
        
        /* Typing Hero Title Styles */
        .hero-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; letter-spacing: -0.5px; min-height: 2.8rem; }
        .typed-cursor { font-weight: 400; color: var(--primary); animation: blink 0.7s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* Sections */
        .section-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 40px; }
        
        .script-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: 0.2s; position: relative; }
        .script-card:hover { transform: translateY(-3px); border-color: rgba(56,189,248,0.4); }
        .script-img-wrapper { position: relative; width: 100%; height: 130px; background: #1e293b; }
        .script-img { width: 100%; height: 100%; object-fit: cover; }
        
        .key-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; gap: 4px; border: 1px solid var(--border); }
        
        .script-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .script-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .script-desc { font-size: 0.8rem; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
        .script-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 8px; }

        .user-pill { display: flex; align-items: center; gap: 8px; background: var(--surface); padding: 6px 14px; border-radius: 30px; border: 1px solid var(--border); cursor: pointer; }
        .user-pill img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside>
        <div>
            <a href="/" class="logo">
                <img src="/logo.png" alt="ScriptsForExe.gg" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                <span style="display:none;">ScriptsForExe<span style="color: var(--primary);">.gg</span></span>
            </a>
            <ul class="sidebar-menu">
                <li><a href="/" class="active"> Home</a></li>
                <li><a onclick="checkAuth('/upload.html')"> Upload Script</a></li>
                <li><a onclick="checkAuth('/profile.html')"> Profile</a></li>
                <li><a onclick="checkAuth('/settings.html')"> Settings</a></li>
                <li id="admin-sidebar" style="display:none;"><a href="/admin.html"> Admin Panel</a></li>
            </ul>
        </div>
        <div class="sidebar-account" id="sidebarAuth">
            <a href="/auth/discord" class="sidebar-btn"> Login with Discord</a>
        </div>
    </aside>

    <!-- Main Section -->
    <main>
        <div class="top-header">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search scripts, games, executors..." oninput="filterScripts()">
            </div>
            <div id="topAuthRight"></div>
        </div>

        <h1 class="hero-title"><span id="typedText"></span><span class="typed-cursor">|</span></h1>

        <div class="section-title">Newest</div>
        <div id="newestGrid" class="grid"><p style="color:var(--text-muted);">Loading scripts...</p></div>
    </main>

    <script>
        // Typing Effect Script
        const words = [
            "Largest Roblox Script Index and Executors with Daily Updates",
            "Find the Best Community Verified Scripts & Hubs",
            "Find the Best Trending Scripts",
            "Secure Key System & Fast Script Execution"
        ];
        let i = 0;
        let timer;

        function typingEffect() {
            let word = words[i];
            let j = 0;
            let target = document.getElementById("typedText");

            function type() {
                if (j < word.length) {
                    target.innerHTML += word.charAt(j);
                    j++;
                    setTimeout(type, 45);
                } else {
                    // Stay for 2 seconds before deleting
                    setTimeout(erase, 2000);
                }
            }

            function erase() {
                if (j > 0) {
                    target.innerHTML = word.substring(0, j - 1);
                    j--;
                    setTimeout(erase, 25);
                } else {
                    i = (i + 1) % words.length;
                    setTimeout(typingEffect, 300);
                }
            }

            type();
        }

        typingEffect();

        let globalScripts = [];

        async function checkAuth(destination) {
            const res = await fetch('/api/me');
            const data = await res.json();
            if (data.authenticated) window.location.href = destination;
            else { alert('Please log in with Discord first.'); window.location.href = '/auth/discord'; }
        }

        async function init() {
            try {
                const meRes = await fetch('/api/me');
                const meData = await meRes.json();
                if (meData.authenticated && meData.user.username && meData.user.username !== 'undefined') {
                    const userHtml = `
                        <div class="user-pill" onclick="window.location.href='/profile.html'">
                            <img src="${meData.user.avatar}" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                            <span style="font-weight:700; font-size:0.85rem;">${meData.user.username}</span>
                        </div>
                    `;
                    document.getElementById('sidebarAuth').innerHTML = `<a href="/logout" style="color:#ef4444; text-decoration:none; font-weight:700; text-align:center;"> Log Out</a>`;
                    document.getElementById('topAuthRight').innerHTML = userHtml;
                }

                const adminRes = await fetch('/api/admin/check');
                const adminData = await adminRes.json();
                if (adminData.admin) document.getElementById('admin-sidebar').style.display = 'block';

                const res = await fetch('/api/scripts');
                globalScripts = await res.json();
                renderFeeds(globalScripts);
            } catch (err) { console.error(err); }
        }

        function renderFeeds(scripts) {
            const newestGrid = document.getElementById('newestGrid');
            newestGrid.innerHTML = '';

            if (scripts.length === 0) {
                newestGrid.innerHTML = '<p style="color:var(--text-muted);">No scripts uploaded yet.</p>';
                return;
            }

            scripts.forEach(s => {
                const cardHtml = `
                    <div class="script-card" onclick="window.location.href='/page.html?id=${s.id}'">
                        <div class="script-img-wrapper">
                            <div class="key-badge">${s.hasKeySystem ? '🔑 Key System' : '🔓 No Key'}</div>
                            <img src="${s.image}" class="script-img">
                        </div>
                        <div class="script-body">
                            <div>
                                <h3 class="script-title">${s.title}</h3>
                                <p class="script-desc">${s.description}</p>
                            </div>
                            <div class="script-meta">
                                <span>👁️ ${s.views || 0} &nbsp; ❤️ ${s.likes ? s.likes.length : 0}</span>
                                <span>by ${s.author?.username || 'Unknown'}</span>
                            </div>
                        </div>
                    </div>
                `;
                newestGrid.innerHTML += cardHtml;
            });
        }

        function filterScripts() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderFeeds(globalScripts.filter(s => s.title.toLowerCase().includes(q) || s.description.toLowerCase().includes(q)));
        }

        init();
    </script>
</body>
</html>
