<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScriptForExe.net — Premium Script Repository</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #07090e;
      --bg-surface: #0d1117;
      --bg-card: rgba(22, 27, 34, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(59, 130, 246, 0.4);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --discord: #5865F2;
      --discord-hover: #4752C4;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(88, 101, 242, 0.04) 0%, transparent 40%);
    }

    nav {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .brand span {
      background: linear-gradient(135deg, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn {
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.2s ease;
    }
    .btn-discord { background-color: var(--discord); color: #fff; box-shadow: 0 4px 14px rgba(88, 101, 242, 0.3); }
    .btn-discord:hover { background-color: var(--discord-hover); }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
    .btn-primary:hover { transform: translateY(-1px); opacity: 0.95; }
    .btn-outline { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }
    .btn-outline:hover { background-color: rgba(255, 255, 255, 0.04); border-color: rgba(255, 255, 255, 0.15); }
    .btn-danger { background-color: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); padding: 0.4rem 0.8rem; font-size: 0.8rem; }
    .btn-danger:hover { background-color: var(--danger); color: #fff; }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg-surface);
      padding: 0.35rem 0.85rem 0.35rem 0.35rem;
      border-radius: 50px;
      border: 1px solid var(--border-color);
    }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-color); }
    .admin-badge { background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(96, 165, 250, 0.2)); color: #60a5fa; font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 700; text-transform: uppercase; }

    main { max-width: 1300px; width: 100%; margin: 2.5rem auto; padding: 0 2rem; flex: 1; }
    .hero-section { margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem; }
    .hero-title h1 { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.5rem; }
    .hero-title p { color: var(--text-secondary); font-size: 1rem; }

    .header-controls { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; }
    .search-bar { flex: 1; min-width: 280px; max-width: 450px; position: relative; }
    .search-bar input { width: 100%; padding: 0.75rem 1rem 0.75rem 2.75rem; background-color: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-primary); font-size: 0.95rem; }
    .search-bar input:focus { outline: none; border-color: var(--accent); }
    .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary); pointer-events: none; }

    .scripts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.5rem; }
    .script-card { background-color: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; gap: 1.25rem; transition: all 0.25s ease; }
    .script-card:hover { border-color: var(--border-hover); transform: translateY(-3px); box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
    .card-title { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); }
    .card-game { font-size: 0.75rem; font-weight: 600; background-color: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); padding: 0.25rem 0.65rem; border-radius: 6px; white-space: nowrap; }
    .card-desc { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; }
    .code-preview { background-color: #05070a; border: 1px solid var(--border-color); border-radius: 8px; padding: 0.85rem; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #38bdf8; overflow-x: auto; white-space: pre; max-height: 110px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-secondary); }
    .card-actions { display: flex; gap: 0.5rem; }
    .empty-state { text-align: center; padding: 5rem 1rem; color: var(--text-secondary); grid-column: 1 / -1; background: var(--bg-card); border: 1px dashed var(--border-color); border-radius: 12px; }
  </style>
</head>
<body>

  <nav>
    <div class="nav-container">
      <a href="/" class="brand">ScriptFor<span>Exe</span>.net</a>
      <div class="nav-actions" id="authSection">
        <a href="/auth/discord" class="btn btn-discord">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          Login with Discord
        </a>
      </div>
    </div>
  </nav>

  <main>
    <div class="hero-section">
      <div class="hero-title">
        <h1>Community Scripts</h1>
        <p>Discover, share, and utilize user-contributed scripts securely.</p>
      </div>
      <a href="/upload.html" class="btn btn-primary" id="openUploadBtn" style="display: none;">+ Upload Script</a>
    </div>

    <div class="header-controls">
      <div class="search-bar">
        <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="Search scripts by title, game, or author..." />
      </div>
    </div>

    <div class="scripts-grid" id="scriptsGrid">
      <div class="empty-state">Loading scripts repository...</div>
    </div>
  </main>

  <footer style="margin-top: 5rem; padding: 2rem 1rem; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.9rem; color: var(--text-secondary); background: var(--bg-surface);">
    <div style="max-width: 1300px; margin: 0 auto; display: flex; justify-content: center; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
      <span>&copy; 2026 ScriptForExe.net</span>
      <span style="opacity: 0.3;">•</span>
      <a href="https://scriptsforexe-net.betteruptime.com/" target="_blank" rel="noopener noreferrer" style="color: var(--text-primary); text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem;" onmouseover="this.style.color='#60a5fa'" onmouseout="this.style.color='var(--text-primary)'">
        <span style="width: 8px; height: 8px; background-color: var(--success); border-radius: 50%; display: inline-block;"></span>
        System Status
      </a>
    </div>
  </footer>

  <script>
    const ADMIN_ID = '1287363175158644757';
    let currentUser = null;
    let allScripts = [];

    const authSection = document.getElementById('authSection');
    const openUploadBtn = document.getElementById('openUploadBtn');
    const scriptsGrid = document.getElementById('scriptsGrid');
    const searchInput = document.getElementById('searchInput');

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    }

    async function fetchUser() {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (data.authenticated && data.user) {
          currentUser = data.user;
          const isAdmin = currentUser.id === ADMIN_ID || currentUser.isAdmin;

          authSection.innerHTML = `
            <div class="user-profile">
              <img src="${currentUser.avatar}" alt="Avatar" class="user-avatar" />
              <span style="font-weight: 600; font-size: 0.9rem;">${escapeHTML(currentUser.username)}</span>
              ${isAdmin ? '<span class="admin-badge">Admin</span>' : ''}
              <a href="/logout" class="btn btn-outline" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; margin-left: 0.25rem;">Logout</a>
            </div>
          `;
          openUploadBtn.style.display = 'inline-flex';
        }
      } catch (err) {
        console.log('Not authenticated');
      }
    }

    async function fetchScripts() {
      try {
        const res = await fetch('/api/scripts');
        allScripts = await res.json();
        renderScripts(allScripts);
      } catch (err) {
        scriptsGrid.innerHTML = '<div class="empty-state">Failed to load scripts repository.</div>';
      }
    }

    function renderScripts(scripts) {
      if (!scripts || scripts.length === 0) {
        scriptsGrid.innerHTML = '<div class="empty-state">No scripts found in the repository yet. Be the first to upload!</div>';
        return;
      }

      scriptsGrid.innerHTML = scripts.map(script => {
        const authorId = script.authorId || script.author?.id;
        const canDelete = currentUser && (currentUser.id === ADMIN_ID || currentUser.isAdmin || currentUser.id === authorId);
        const codeText = script.code || script.scriptContent || '';

        return `
          <div class="script-card">
            <div>
              <div class="card-header">
                <div class="card-title">${escapeHTML(script.title)}</div>
                <span class="card-game">${escapeHTML(script.category || script.game || 'Universal')}</span>
              </div>
              <p class="card-desc" style="margin-top: 0.5rem;">${escapeHTML(script.description)}</p>
            </div>
            <div class="code-preview">${escapeHTML(codeText)}</div>
            <div class="card-footer">
              <span>By <strong>${escapeHTML(script.author?.username || script.author || 'Community')}</strong></span>
              <div class="card-actions">
                <a href="/page.html?id=${script.id}" class="btn btn-outline" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;">View</a>
                <button class="btn btn-primary" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;" onclick="copyScript(this, '${encodeURIComponent(codeText)}')">Copy</button>
                ${canDelete ? `<button class="btn btn-danger" onclick="deleteScript('${script.id}')">Delete</button>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.copyScript = function(btn, encodedCode) {
      navigator.clipboard.writeText(decodeURIComponent(encodedCode)).then(() => {
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        btn.style.backgroundColor = 'var(--success)';
        setTimeout(() => { btn.textContent = originalText; btn.style.backgroundColor = ''; }, 1500);
      });
    };

    window.deleteScript = async function(id) {
      if (!confirm('Are you sure you want to delete this script?')) return;
      try {
        const res = await fetch(`/api/scripts/${id}`, { method: 'DELETE' });
        if (res.ok) {
          allScripts = allScripts.filter(s => s.id !== id);
          renderScripts(allScripts);
        } else {
          alert('Failed to delete script.');
        }
      } catch (err) {
        alert('Error connecting to server.');
      }
    };

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allScripts.filter(s =>
        (s.title && s.title.toLowerCase().includes(q)) ||
        (s.category && s.category.toLowerCase().includes(q)) ||
        (s.description && s.description.toLowerCase().includes(q))
      );
      renderScripts(filtered);
    });

    (async () => {
      await fetchUser();
      await fetchScripts();
    })();
  </script>
</body>
</html>
