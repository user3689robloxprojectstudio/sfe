<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptForExe.net - The Ultimate Roblox Script Hub</title>
    <style>
        :root { --bg: #0b0f19; --card-bg: #131d31; --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8; --border: #1e293b; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        header { background: rgba(19, 29, 49, 0.85); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .logo { font-size: 22px; font-weight: 800; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 12px; align-items: center; }
        .btn { background: var(--accent); color: #0b0f19; padding: 8px 18px; border-radius: 8px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #0ea5e9; transform: translateY(-1px); }
        .hero { text-align: center; padding: 70px 20px 40px; background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 70%); }
        .hero h1 { font-size: 42px; margin-bottom: 10px; font-weight: 900; letter-spacing: -0.5px; }
        .hero p { color: var(--muted); font-size: 18px; max-width: 600px; margin: 0 auto 30px; }
        .search-bar { max-width: 500px; margin: 0 auto; display: flex; background: var(--card-bg); border: 1px solid #334155; border-radius: 12px; padding: 6px; }
        .search-bar input { flex-grow: 1; background: transparent; border: none; color: white; padding: 10px 15px; font-size: 16px; outline: none; }
        .container { max-width: 1280px; margin: 0 auto; padding: 30px 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .section-title { font-size: 22px; font-weight: 700; color: var(--accent); margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .script-card { background: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); transition: all 0.25s ease; display: flex; flex-direction: column; text-decoration: none; color: inherit; position: relative; }
        .script-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px -10px rgba(56, 189, 248, 0.2); }
        .card-img-wrap { position: relative; width: 100%; height: 160px; background: #000; }
        .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .key-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); color: #fbbf24; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; border: 1px solid #fbbf2444; }
        .card-content { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 18px; font-weight: 700; margin: 0 0 6px 0; color: var(--text); }
        .card-desc { font-size: 13px; color: var(--muted); margin: 0 0 15px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">⚡ ScriptForExe.net</a>
        <div class="nav-links" id="auth-nav">
            <a href="/upload.html" class="btn">Upload Script</a>
            <a href="/auth/discord" class="btn" style="background: #5865F2; color: white;">Login with Discord</a>
        </div>
    </header>

    <div class="hero">
        <h1>Next-Gen Roblox Script Index</h1>
        <p>Explore, download, and publish elite community scripts instantly.</p>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search scripts or games..." oninput="filterScripts()">
        </div>
    </div>

    <div class="container">
        <div class="section-header">
            <h2 class="section-title">🔥 Featured & Newest Scripts</h2>
        </div>
        <div class="grid" id="scripts-grid">
            <p style="color: var(--muted);">Loading scripts from cloud database...</p>
        </div>
    </div>

    <script>
        let allScripts = [];

        async function loadData() {
            try {
                const meRes = await fetch('/api/me');
                const meData = await meRes.json();
                const authNav = document.getElementById('auth-nav');

                if (meData.authenticated) {
                    authNav.innerHTML = `
                        <a href="/upload.html" class="btn">Upload Script</a>
                        <a href="/settings.html" class="btn" style="background: #1e293b; color: white; display: flex; align-items: center; gap: 8px; border: 1px solid #334155;">
                            <img src="${meData.user.avatar}" style="width: 22px; height: 22px; border-radius: 50%;"> Settings
                        </a>
                        <a href="/logout" class="btn" style="background: #ef4444; color: white;">Logout</a>
                    `;
                }

                const res = await fetch('/api/scripts');
                allScripts = await res.json();
                renderScripts(allScripts);
            } catch (err) {
                console.error('Error loading scripts:', err);
                document.getElementById('scripts-grid').innerHTML = '<p style="color: #ef4444;">Failed to load script database.</p>';
            }
        }

        function renderScripts(scripts) {
            const grid = document.getElementById('scripts-grid');
            if (!scripts || scripts.length === 0) {
                grid.innerHTML = '<p style="color: var(--muted);">No scripts found.</p>';
                return;
            }

            grid.innerHTML = '';
            scripts.forEach(script => {
                const card = document.createElement('a');
                card.className = 'script-card';
                card.href = `/page.html?id=${script.id}`;
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${script.image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600'}" alt="${script.title}">
                        ${script.hasKeySystem ? '<span class="key-badge">🔑 Key System</span>' : ''}
                    </div>
                    <div class="card-content">
                        <div>
                            <h3 class="card-title">${script.title}</h3>
                            <p class="card-desc">${script.description}</p>
                        </div>
                        <div class="card-footer">
                            <span>👁️ ${script.views || 0} &nbsp; ❤️ ${(script.likes || []).length}</span>
                            <span>by ${script.author?.username || 'Community'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterScripts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allScripts.filter(s => 
                s.title.toLowerCase().includes(query) || 
                s.description.toLowerCase().includes(query) ||
                (s.category && s.category.toLowerCase().includes(query))
            );
            renderScripts(filtered);
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
