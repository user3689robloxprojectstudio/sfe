<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptsForExe.gg - Largest Roblox Script Index</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        header { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 22px; font-weight: bold; color: #38bdf8; text-decoration: none; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .btn { background: #38bdf8; color: #0f172a; padding: 8px 16px; border-radius: 6px; font-weight: bold; text-decoration: none; border: none; cursor: pointer; }
        .btn:hover { background: #0ea5e9; }
        .hero { text-align: center; padding: 50px 20px; background: linear-gradient(to bottom, #1e293b, #0f172a); }
        .hero h1 { font-size: 36px; margin-bottom: 10px; color: #f8fafc; }
        .hero p { color: #94a3b8; font-size: 18px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .section-title { font-size: 24px; margin-bottom: 20px; border-bottom: 2px solid #334155; padding-bottom: 8px; color: #38bdf8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .script-card { background: #1e293b; border-radius: 10px; overflow: hidden; border: 1px solid #334155; transition: transform 0.2s; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
        .script-card:hover { transform: translateY(-4px); border-color: #38bdf8; }
        .card-img-container { position: relative; width: 100%; height: 160px; background: #0f172a; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .key-badge { position: absolute; top: 10px; right: 10px; background: #000000aa; color: #fbbf24; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 18px; font-weight: bold; margin: 0 0 6px 0; color: #f8fafc; }
        .card-desc { font-size: 14px; color: #94a3b8; margin: 0 0 15px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #64748b; border-top: 1px solid #334155; padding-top: 10px; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">ScriptsForExe.gg</a>
        <div class="nav-links" id="auth-nav">
            <a href="/upload.html" class="btn">Upload Script</a>
            <a href="/auth/discord" class="btn" style="background: #5865F2; color: white;">Login with Discord</a>
        </div>
    </header>

    <div class="hero">
        <h1>Largest Roblox Script Index and Executors</h1>
        <p>Discover, share, and test the best community-made Roblox scripts.</p>
    </div>

    <div class="container">
        <h2 class="section-title">Newest Scripts</h2>
        <div class="grid" id="scripts-grid">
            <p style="color: #94a3b8;">Loading scripts...</p>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                // Check auth state
                const meRes = await fetch('/api/me');
                const meData = await meRes.json();
                const authNav = document.getElementById('auth-nav');

                if (meData.authenticated) {
                    authNav.innerHTML = `
                        <a href="/upload.html" class="btn">Upload Script</a>
                        <a href="/settings.html" class="btn" style="background: #334155; color: white; display: flex; align-items: center; gap: 8px;">
                            <img src="${meData.user.avatar}" style="width: 24px; height: 24px; border-radius: 50%;"> Settings
                        </a>
                        <a href="/logout" class="btn" style="background: #ef4444; color: white;">Logout</a>
                    `;
                }

                // Load scripts
                const res = await fetch('/api/scripts');
                const scripts = await res.json();
                const grid = document.getElementById('scripts-grid');

                if (!scripts || scripts.length === 0) {
                    grid.innerHTML = '<p style="color: #94a3b8;">No scripts uploaded yet.</p>';
                    return;
                }

                grid.innerHTML = '';
                scripts.forEach(script => {
                    const card = document.createElement('a');
                    card.className = 'script-card';
                    card.href = `/page.html?id=${script.id}`;
                    card.innerHTML = `
                        <div class="card-img-container">
                            <img src="${script.image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600'}" alt="${script.title}">
                            ${script.hasKeySystem ? '<span class="key-badge">🔑 Key System</span>' : ''}
                        </div>
                        <div class="card-body">
                            <div>
                                <h3 class="card-title">${script.title}</h3>
                                <p class="card-desc">${script.description}</p>
                            </div>
                            <div class="card-footer">
                                <span>👁️ ${script.views || 0} &nbsp; ❤️ ${(script.likes || []).length}</span>
                                <span>by ${script.author?.username || 'Unknown'}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error('Error loading index data:', err);
                document.getElementById('scripts-grid').innerHTML = '<p style="color: #ef4444;">Failed to load scripts.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
