<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptForExe.net - The Ultimate Roblox Script Hub</title>
    <style>
        :root { --bg: #0b0f19; --card-bg: #131d31; --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8; --border: #1e293b; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* Header & Navbar */
        header { background: rgba(19, 29, 49, 0.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .logo { font-size: 20px; font-weight: 800; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .nav-right { display: flex; gap: 14px; align-items: center; }
        
        /* Buttons */
        .btn { background: var(--text); color: var(--bg); padding: 8px 18px; border-radius: 8px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; transition: all 0.2s ease; font-size: 14px; }
        .btn:hover { background: #e2e8f0; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,255,255,0.1); }
        .btn-accent { background: var(--accent); color: var(--bg); }
        .btn-accent:hover { background: #0ea5e9; }
        .btn-discord { background: #5865F2; color: white; }
        .btn-discord:hover { background: #4752C4; }

        /* Sidebar Toggle & Drawer */
        .menu-toggle { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .menu-toggle:hover { border-color: var(--accent); }

        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #090d16; border-right: 1px solid var(--border); z-index: 200; transition: left 0.3s ease; padding: 30px 20px; box-sizing: border-box; }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .sidebar-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
        .sidebar-close:hover { color: var(--text); }
        .sidebar-nav a { display: block; color: var(--muted); text-decoration: none; padding: 12px 15px; border-radius: 8px; margin-bottom: 8px; font-weight: 500; transition: 0.2s; }
        .sidebar-nav a:hover { background: var(--card-bg); color: var(--text); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 150; display: none; }
        .overlay.active { display: block; }

        /* Hero with Typing Effect */
        .hero { text-align: center; padding: 80px 20px 50px; background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 75%); }
        .hero h1 { font-size: 44px; margin-bottom: 12px; font-weight: 800; letter-spacing: -1px; }
        .typing-container { color: var(--accent); border-right: 3px solid var(--accent); white-space: nowrap; animation: blink 0.75s step-end infinite; }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--accent); } }
        
        .hero p { color: var(--muted); font-size: 16px; max-width: 550px; margin: 0 auto 30px; }
        
        .search-bar { max-width: 480px; margin: 0 auto; display: flex; background: var(--card-bg); border: 1px solid #334155; border-radius: 12px; padding: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .search-bar input { flex-grow: 1; background: transparent; border: none; color: white; padding: 10px 15px; font-size: 15px; outline: none; }

        /* Grid Layout */
        .container { max-width: 1240px; margin: 0 auto; padding: 40px 20px; }
        .section-header { margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .section-title { font-size: 20px; font-weight: 700; color: var(--text); margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .script-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); transition: all 0.2s ease; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
        .script-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.15); }
        .card-img-wrap { position: relative; width: 100%; height: 160px; background: #000; }
        .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .key-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); color: #fbbf24; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid #fbbf2433; }
        .card-content { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 17px; font-weight: 700; margin: 0 0 6px 0; color: var(--text); }
        .card-desc { font-size: 13px; color: var(--muted); margin: 0 0 15px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; }
    </style>
</head>
<body>

    <!-- Sidebar Navigation Drawer -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span style="font-weight: 700; color: var(--accent);">Navigation</span>
            <button class="sidebar-close" onclick="toggleSidebar()">×</button>
        </div>
        <div class="sidebar-nav">
            <a href="/">Home Index</a>
            <a href="/upload.html">Upload Script</a>
            <a href="/settings.html">Account Settings</a>
        </div>
    </div>

    <!-- Main Header -->
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <button class="menu-toggle" onclick="toggleSidebar()">☰ Menu</button>
            <a href="/" class="logo">ScriptForExe.net</a>
        </div>
        <div class="nav-right" id="auth-nav">
            <a href="/upload.html" class="btn btn-accent">Upload Script</a>
            <a href="/auth/discord" class="btn btn-discord">Login</a>
        </div>
    </header>

    <!-- Hero Section with Typing Animation -->
    <div class="hero">
        <h1>Next-Gen <span class="typing-container" id="typed-text"></span></h1>
        <p>Explore, download, and publish verified community Roblox scripts instantly.</p>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search scripts or game titles..." oninput="filterScripts()">
        </div>
    </div>

    <!-- Script Grid Container -->
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Newest Scripts</h2>
        </div>
        <div class="grid" id="scripts-grid">
            <p style="color: var(--muted);">Loading script database...</p>
        </div>
    </div>

    <script>
        // Sidebar Toggle Handler
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        // Typing Effect Logic
        const words = ["Roblox Script Index", "Execution Hub", "Scripter Community"];
        let i = 0;
        let timer;

        function typingEffect() {
            let word = words[i].split("");
            let loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typed-text').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000);
                    return;
                }
                timer = setTimeout(loopTyping, 100);
            };
            loopTyping();
        }

        function deletingEffect() {
            let word = words[i].split("");
            let loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typed-text').innerHTML = word.join("");
                } else {
                    i = (i + 1) % words.length;
                    setTimeout(typingEffect, 500);
                    return;
                }
                timer = setTimeout(loopDeleting, 50);
            };
            loopDeleting();
        }
        typingEffect();

        // Load Scripts & Auth State
        let allScripts = [];

        async function loadData() {
            try {
                const meRes = await fetch('/api/me');
                const meData = await meRes.json();
                const authNav = document.getElementById('auth-nav');

                if (meData.authenticated) {
                    authNav.innerHTML = `
                        <a href="/upload.html" class="btn btn-accent">Upload Script</a>
                        <a href="/settings.html" class="btn" style="background: var(--text); color: var(--bg); display: flex; align-items: center; gap: 8px;">
                            <img src="${meData.user.avatar}" style="width: 20px; height: 20px; border-radius: 50%;"> Settings
                        </a>
                        <a href="/logout" class="btn" style="background: #ef4444; color: white;">Logout</a>
                    `;
                }

                const res = await fetch('/api/scripts');
                allScripts = await res.json();
                renderScripts(allScripts);
            } catch (err) {
                console.error('Error loading index data:', err);
                document.getElementById('scripts-grid').innerHTML = '<p style="color: #ef4444;">Failed to load script database.</p>';
            }
        }

        function renderScripts(scripts) {
            const grid = document.getElementById('scripts-grid');
            if (!scripts || scripts.length === 0) {
                grid.innerHTML = '<p style="color: var(--muted);">No scripts available.</p>';
                return;
            }

            grid.innerHTML = '';
            scripts.forEach(script => {
                const card = document.createElement('a');
                card.className = 'script-card';
                card.href = `/page.html?id=${script.id}`;
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${script.image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600'}" alt="${script.title}">
                        ${script.hasKeySystem ? '<span class="key-badge">Key System</span>' : ''}
                    </div>
                    <div class="card-content">
                        <div>
                            <h3 class="card-title">${script.title}</h3>
                            <p class="card-desc">${script.description}</p>
                        </div>
                        <div class="card-footer">
                            <span>Views: ${script.views || 0} | Likes: ${(script.likes || []).length}</span>
                            <span>by ${script.author?.username || 'Community'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterScripts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allScripts.filter(s => 
                s.title.toLowerCase().includes(query) || 
                s.description.toLowerCase().includes(query) ||
                (s.category && s.category.toLowerCase().includes(query))
            );
            renderScripts(filtered);
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
