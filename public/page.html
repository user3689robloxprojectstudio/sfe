<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Details - ScriptsForExe.gg</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 30px auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #38bdf8; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        .script-header { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 25px; flex-wrap: wrap; }
        .script-img { width: 220px; height: 140px; object-fit: cover; border-radius: 8px; border: 1px solid #334155; background: #0f172a; }
        .script-info h1 { margin: 0 0 10px 0; color: #f8fafc; font-size: 28px; }
        .script-info p { color: #94a3b8; margin: 0 0 15px 0; line-height: 1.5; }
        .meta-badges { display: flex; gap: 10px; font-size: 14px; color: #38bdf8; }
        .code-box-container { margin-top: 25px; }
        .code-header { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 15px; border-radius: 8px 8px 0 0; border: 1px solid #334155; border-bottom: none; }
        pre { background: #090d16; padding: 15px; border-radius: 0 0 8px 8px; margin: 0; overflow-x: auto; color: #38bdf8; font-family: monospace; border: 1px solid #334155; max-height: 300px; }
        .btn { background: #38bdf8; color: #0f172a; padding: 8px 16px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #0ea5e9; }
        .comments-section { margin-top: 35px; border-top: 1px solid #334155; padding-top: 20px; }
        .comment-box { background: #0f172a; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; }
        .comment-input-area { display: flex; gap: 10px; margin-top: 15px; }
        textarea { flex-grow: 1; background: #0f172a; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; resize: vertical; min-height: 60px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="back-link">← Back to Index</a>
        
        <div id="script-content-area">
            <p style="color: #94a3b8;">Loading script details...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const scriptId = urlParams.get('id');

        async function loadScriptDetails() {
            if (!scriptId) {
                document.getElementById('script-content-area').innerHTML = '<p style="color: #ef4444;">Script not found.</p>';
                return;
            }

            try {
                const res = await fetch(`/api/scripts/${scriptId}`);
                if (!res.ok) {
                    document.getElementById('script-content-area').innerHTML = '<p style="color: #ef4444;">Script not found.</p>';
                    return;
                }
                const script = await res.json();

                const container = document.getElementById('script-content-area');
                container.innerHTML = `
                    <div class="script-header">
                        <img src="${script.image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600'}" class="script-img" alt="Thumbnail">
                        <div class="script-info">
                            <h1>${script.title}</h1>
                            <p>${script.description}</p>
                            <div class="meta-badges">
                                <span>Category: <strong>${script.category}</strong></span>
                                <span>Views: <strong>${script.views || 0}</strong></span>
                                <span>Likes: <strong id="like-count">${(script.likes || []).length}</strong></span>
                            </div>
                            <div style="margin-top: 15px; display: flex; gap: 10px;">
                                <button onclick="likeScript()" class="btn" style="background: #ef4444; color: white;">❤️ Like Script</button>
                                <a href="${script.gameLink || '#'}" target="_blank" class="btn" style="background: #334155; color: white;">🎮 Game Link</a>
                            </div>
                        </div>
                    </div>

                    <div class="code-box-container">
                        <div class="code-header">
                            <span>Script Code</span>
                            <button onclick="copyCode()" class="btn" style="padding: 4px 10px; font-size: 12px;">Copy Code</button>
                        </div>
                        <pre><code id="code-text">${escapeHtml(script.scriptContent || script.code || '-- No code provided')}</code></pre>
                    </div>

                    <div class="comments-section">
                        <h3>Comments</h3>
                        <div id="comments-list">
                            ${(script.comments || []).length === 0 ? '<p style="color: #64748b;">No comments yet.</p>' : ''}
                            ${(script.comments || []).map(c => `
                                <div class="comment-box">
                                    <strong style="color: #38bdf8;">${c.author?.username || c.username || 'User'}</strong>
                                    <p style="margin: 5px 0 0 0; color: #cbd5e1;">${escapeHtml(c.text)}</p>
                                </div>
                            `).join('')}
                        </div>

                        <div class="comment-input-area">
                            <textarea id="comment-input" placeholder="Write a comment..."></textarea>
                            <button onclick="postComment()" class="btn" style="align-self: flex-end;">Send</button>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error('Error loading script detail:', err);
                document.getElementById('script-content-area').innerHTML = '<p style="color: #ef4444;">Error loading script.</p>';
            }
        }

        async function copyCode() {
            const code = document.getElementById('code-text').textContent;
            await navigator.clipboard.writeText(code);
            alert('Script code copied to clipboard!');
        }

        async function likeScript() {
            try {
                const res = await fetch(`/api/scripts/${scriptId}/like`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('like-count').textContent = data.likes;
                } else {
                    alert('Please log in with Discord to like scripts.');
                }
            } catch (err) {
                alert('Error liking script.');
            }
        }

        async function postComment() {
            const text = document.getElementById('comment-input').value;
            if (!text.trim()) return;

            try {
                const res = await fetch(`/api/scripts/${scriptId}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('comment-input').value = '';
                    loadScriptDetails(); // Reload comments
                } else {
                    alert('Please log in with Discord to comment.');
                }
            } catch (err) {
                alert('Error posting comment.');
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.addEventListener('DOMContentLoaded', loadScriptDetails);
    </script>
</body>
</html>
