<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Script — ScriptForExe.net</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #07090e;
      --bg-surface: #0d1117;
      --bg-card: rgba(22, 27, 34, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
    }

    .nav-container { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.35rem; font-weight: 800; color: var(--text-primary); text-decoration: none; }
    .brand span { background: linear-gradient(135deg, #60a5fa, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .btn {
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
    .btn-outline { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }
    .btn-outline:hover { background-color: rgba(255, 255, 255, 0.04); }

    main { max-width: 1000px; width: 100%; margin: 3rem auto; padding: 0 2rem; flex: 1; }

    .script-detail-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.5rem; }
    .detail-title { font-size: 1.85rem; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 0.5rem; }
    .detail-game { font-size: 0.8rem; font-weight: 600; background-color: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); padding: 0.3rem 0.75rem; border-radius: 6px; white-space: nowrap; }
    .detail-desc { color: var(--text-secondary); font-size: 1rem; margin-bottom: 2rem; }

    .code-box-container { position: relative; margin-bottom: 2rem; }
    .code-box {
      background-color: #05070a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      overflow-x: auto;
      white-space: pre;
      max-height: 350px;
    }

    .detail-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary); }
  </style>
</head>
<body>

  <nav>
    <div class="nav-container">
      <a href="/" class="brand">ScriptFor<span>Exe</span>.net</a>
      <a href="/" class="btn btn-outline">← Back to Repository</a>
    </div>
  </nav>

  <main>
    <div class="script-detail-card" id="scriptContainer">
      <div style="text-align: center; padding: 4rem; color: var(--text-secondary);">Loading script details...</div>
    </div>
  </main>

  <script>
    async function loadScriptDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const scriptId = urlParams.get('id');
      const container = document.getElementById('scriptContainer');

      if (!scriptId) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-secondary);">Invalid script ID specified.</div>';
        return;
      }

      try {
        const res = await fetch(`/api/scripts/${scriptId}`);
        if (!res.ok) throw new Error('Not found');
        const script = await res.json();
        const codeText = script.code || script.scriptContent || '';

        container.innerHTML = `
          <div class="detail-header">
            <div>
              <div class="detail-title">${escapeHTML(script.title)}</div>
              <p class="detail-desc">${escapeHTML(script.description)}</p>
            </div>
            <span class="detail-game">${escapeHTML(script.category || script.game || 'Universal')}</span>
          </div>

          <div class="code-box-container">
            <div class="code-box">${escapeHTML(codeText)}</div>
          </div>

          <div class="detail-footer">
            <span>Author: <strong>${escapeHTML(script.author?.username || script.author || 'Community')}</strong> &bull; Views: ${script.views || 0}</span>
            <button class="btn btn-primary" onclick="copyCode(this, '${encodeURIComponent(codeText)}')">Copy Code</button>
          </div>
        `;
      } catch (err) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-secondary);">Script not found or failed to load.</div>';
      }
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
    }

    window.copyCode = function(btn, encodedCode) {
      navigator.clipboard.writeText(decodeURIComponent(encodedCode)).then(() => {
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        btn.style.backgroundColor = 'var(--success)';
        setTimeout(() => { btn.textContent = originalText; btn.style.backgroundColor = ''; }, 1500);
      });
    };

    loadScriptDetail();
  </script>
</body>
</html>
