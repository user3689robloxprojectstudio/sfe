<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Details - ScriptForExe.net</title>
    <style>
        :root { --bg: #0b0f19; --card-bg: #131d31; --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8; --border: #1e293b; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 30px 20px; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--border); }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        .script-header { display: flex; gap: 25px; align-items: flex-start; margin-bottom: 30px; flex-wrap: wrap; }
        .script-img { width: 240px; height: 150px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: #000; }
        .script-info h1 { margin: 0 0 10px 0; color: var(--text); font-size: 30px; font-weight: 800; }
        .script-info p { color: var(--muted); margin: 0 0 20px 0; line-height: 1.6; font-size: 15px; }
        .meta-badges { display: flex; gap: 15px; font-size: 14px; color: var(--accent); flex-wrap: wrap; }
        .code-box-wrap { margin-top: 30px; }
        .code-header { display: flex; justify-content: space-between; align-items: center; background: #090d16; padding: 12px 18px; border-radius: 10px 10px 0 0; border: 1px solid var(--border); border-bottom: none; font-weight: 600; }
        pre { background: #060910; padding: 20px; border-radius: 0 0 10px 10px; margin: 0; overflow-x: auto; color: var(--accent); font-family: 'Courier New', monospace; border: 1px solid var(--border); max-height: 350px; font-size: 14px; }
        .btn { background: var(--accent); color: #0b0f19; padding: 10px 20px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; text-decoration: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { background: #0ea5e9; }
        .comments-section { margin-top: 40px; border-top: 1px solid var(--border); padding-top: 25px; }
        .comment-box { background: #090d16; padding: 14px 18px; border-radius: 10px; margin-bottom: 12px; border: 1px solid var(--border); }
        .comment-input-area { display: flex; gap: 12px; margin-top: 20px; }
        textarea { flex-grow: 1; background: #090d16; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; resize: vertical; min-height: 70px; outline: none; }
        textarea:focus { border-color: var(--accent); }
    </style>
</head>
<body>

    <div class="container">
        <a href="/" class="back-link">← Back to Hub</a>
        <div id="script-content-area">
            <p style="color: var(--muted);">Loading script details...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const scriptId = urlParams.get('id');

        async function loadScriptDetails() {
            if (!scriptId) {
                document.getElementById('script-content-area').innerHTML = '<p style="color: #ef4444;">Script ID missing.</p>';
                return;
            }

            try {
                const res = await fetch(`/api/scripts/${scriptId}`);
                if (!res.ok) {
                    document.getElementById('script-content-area').innerHTML = '<p style="color: #ef4444;">Script not found.</p>';
                    return;
                }
                const script = await res.json();

                const container = document.getElementById('script-content-area');
                container.innerHTML = `
                    <div class="script-header">
                        <img src="${script.image || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600'}" class="script-img" alt="Thumbnail">
                        <div class="script-info">
                            <h1>${script.title}</h1>
                            <p>${script.description}</p>
                            <div class="meta-badges">
                                <span>Category: <strong>${script.category}</strong></span>
                                <span>Views: <strong>${script.views || 0}</strong></span>
                                <span>Likes: <strong id="like-count">${(script.likes || []).length}</strong></span>
                            </div>
                            <div style="margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap;">
                                <button onclick="likeScript()" class="btn" style="background: #ef4444; color: white;">❤️ Like Script</button>
                                <a href="${script.gameLink || '#'}" target="_blank" class="btn" style="background: #1e293b; color: white; border: 1px solid #334155;">🎮 Game Link</a>
                            </div>
                        </div>
                    </div>

                    <div class="code-box-wrap">
                        <div class="code-header">
                            <span>Lua Source Code</span>
                            <button onclick="copyCode()" class="btn" style="padding: 6px 14px; font-size: 13px;">Copy Code</button>
                        </div>
                        <pre><code id="code-text">${escapeHtml(script.scriptContent || script.code || '-- No code provided')}</code></pre>
                    </div>

                    <div class="comments-section">
                        <h3>Community Comments</h3>
                        <div id="comments-list">
                            ${(script.comments || []).length === 0 ? '<p style="color: var(--muted);">No comments yet. Be the first!</p>' : ''}
                            ${(script.comments || []).map(c => `
                                <div class="comment-box">
                                    <strong style="color: var(--accent);">${c.author?.username || c.username || 'User'}</strong>
                                    <p style="margin: 6px 0 0 0; color: #cbd5e1; font-size: 14px;">${escapeHtml(c.text)}</p>
                                </div>
                            `).join('')}
                        </div>

                        <div class="comment-input-area">
                            <textarea id="comment-input" placeholder="Write a comment..."></textarea>
                            <button onclick="postComment()" class="btn" style="align-self: flex-end;">Post</button>
                        </div>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                document.getElementById('script-content-area').innerHTML = '<p style="color: #ef4444;">Error loading script data.</p>';
            }
        }

        async function copyCode() {
            const code = document.getElementById('code-text').textContent;
            await navigator.clipboard.writeText(code);
            alert('Script copied to clipboard!');
        }

        async function likeScript() {
            try {
                const res = await fetch(`/api/scripts/${scriptId}/like`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('like-count').textContent = data.likes;
                } else {
                    alert('Please log in with Discord to like scripts.');
                }
            } catch {
                alert('Error liking script.');
            }
        }

        async function postComment() {
            const text = document.getElementById('comment-input').value;
            if (!text.trim()) return;

            try {
                const res = await fetch(`/api/scripts/${scriptId}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('comment-input').value = '';
                    loadScriptDetails();
                } else {
                    alert('Please log in with Discord to comment.');
                }
            } catch {
                alert('Error posting comment.');
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.addEventListener('DOMContentLoaded', loadScriptDetails);
    </script>
</body>
</html>
